name: Apply (gated)

# Reviewer-gated apply: the just-in-time-to-prod control in CI. Plans read-only,
# runs the destroy guard, then pauses on the `prod-apply` environment for a
# required reviewer before applying the exact saved plan. See tf-apply.yml in
# platform-guardrails.
#
# INACTIVE for Azure. The shared tf-apply.yml authenticates with
# aws-actions/configure-aws-credentials and has no azure/login step yet, so the
# credentialed jobs cannot mint an Azure token. Credentialed applies for this
# repo run locally (az login, then terraform apply against the azurerm backend).
#
# ACTIVATE once platform-guardrails gains an azure/login OIDC path:
#   1. add azure_client_id / azure_tenant_id / azure_subscription_id inputs and
#      an azure/login step to tf-apply.yml, cut a new tag
#   2. create a user-assigned managed identity with a GitHub federated credential
#   3. create a `prod-apply` GitHub environment with a required reviewer
#   4. bump the pin below and pass the Azure inputs, then add a push trigger
#
# Kept on workflow_dispatch only so it never auto-fires. aws_role_arn is left
# empty, which makes the AWS credential step self-skip.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply:
    permissions:
      contents: read
      id-token: write
    uses: jordann6/platform-guardrails/.github/workflows/tf-apply.yml@v1.3.0
    with:
      terraform_dir: terraform
      environment: prod-apply
      plan_role_arn: ""
      apply_role_arn: ""
      aws_region: ""
