name: Apply (gated)

# Reviewer-gated apply: the just-in-time-to-prod control in CI. The plan job
# signs in as the read-scoped id-alz-gha-plan identity, plans, and runs the
# destroy guard. The apply job is bound to the `prod-apply` environment, pauses
# for a required reviewer, then signs in as id-alz-gha-apply and applies the
# exact saved plan. See tf-apply.yml in platform-guardrails.
#
# Only ci-proof/ is applied here. The apply identity is Contributor on rg-alz-ci
# and nothing else; governance (terraform/), the workload and compute stay
# operator-applied, and bootstrap/ owns both identities, so CI can never rewrite
# its own trust.
#
# Dispatch from main: the plan identity trusts pull requests and ref main only.
#
# Pinned to one platform-guardrails SHA with the tag in a comment, and the same
# SHA is passed as guardrails_ref so the scripts match the reviewed workflow.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply:
    permissions:
      contents: read
      id-token: write
    uses: jordann6/platform-guardrails/.github/workflows/tf-apply.yml@c13311e2cc20b48af292d067e0b936f43116e257 # v1.8.1
    with:
      guardrails_ref: c13311e2cc20b48af292d067e0b936f43116e257
      terraform_dir: ci-proof
      environment: prod-apply
      azure_plan_client_id: ${{ vars.AZURE_PLAN_CLIENT_ID }}
      azure_apply_client_id: ${{ vars.AZURE_APPLY_CLIENT_ID }}
      azure_tenant_id: ${{ vars.AZURE_TENANT_ID }}
      azure_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
