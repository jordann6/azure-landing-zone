name: Guardrails

on:
  push:
    branches: [main]
  pull_request:

# The static half is credential-free by design. Everything in the `static` job
# runs analysis over Terraform that, on a pull_request event, was authored by
# whoever opened the PR, so nothing here holds a permission that can mint a
# cloud token. This repo replaces the old report-only security-gate.yml with the
# shared toolkit so Azure and AWS run the identical static gates.
#
# Version pins: the reusable-workflow pin here (tf-ci) references v1.3.0, the
# same tag the AWS repo pins. The credentialed apply/destroy/ttl-guard live in
# their own files and stay inactive until platform-guardrails grows an
# azure/login OIDC path (its tf-plan/apply/destroy configure AWS creds only).
permissions:
  contents: read

jobs:
  static:
    uses: jordann6/platform-guardrails/.github/workflows/tf-ci.yml@v1.3.0
    with:
      terraform_dir: terraform
      #
      # skip_policy: this repo carries no Rego yet. The shared conftest gate runs
      # the AWS-shaped policy/ set, which has no google_/azurerm_ rules. Azure OPA
      # rules are a tracked follow-up; until they exist the conftest job is
      # skipped rather than run against rules that do not apply here.
      skip_policy: true

  # One static job per Terraform root: base (above), the prod workload, and the
  # member portal. Same gates, same pin, same reason for skip_policy.
  static-workload:
    uses: jordann6/platform-guardrails/.github/workflows/tf-ci.yml@v1.3.0
    with:
      terraform_dir: workload
      skip_policy: true

  static-portal:
    uses: jordann6/platform-guardrails/.github/workflows/tf-ci.yml@v1.3.0
    with:
      terraform_dir: portal
      skip_policy: true

  # The portal app's unit tests (no database or Azure needed).
  app-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install fastapi==0.115.6 httpx pytest pyodbc==5.2.0 "PyJWT[crypto]==2.10.1"
      - name: Run tests
        working-directory: app
        run: python -m pytest -q
