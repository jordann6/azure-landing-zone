apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: grafana-admin
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: ${GRAFANA_CLIENT_ID}
    keyvaultName: ${KEY_VAULT_NAME}
    tenantId: ${TENANT_ID}
    objects: |
      array:
        - |
          objectName: grafana-admin-password
          objectType: secret
