[server]
http_port = 3000

[security]
admin_user = admin
disable_gravatar = true
cookie_secure = false

[auth.anonymous]
enabled = false

[users]
allow_sign_up = false

[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false

# The Azure Prometheus data source authenticates with the pod's federated token
# (AZURE_CLIENT_ID, AZURE_TENANT_ID and AZURE_FEDERATED_TOKEN_FILE, injected by the
# workload identity webhook).
[azure]
workload_identity_enabled = true

[log]
mode = console
