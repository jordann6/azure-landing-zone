apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: observability
resources:
  - serviceaccount.yaml
  - secretproviderclass.yaml
  - deployment.yaml
  - service.yaml
configMapGenerator:
  # Datasource carries ${AMW_QUERY_ENDPOINT}, so Flux substitution stays on here.
  - name: grafana-datasources
    files:
      - datasources.yaml
  # grafana.ini and the dashboards carry Grafana syntax; substitution off.
  - name: grafana-config
    files:
      - grafana.ini
      - dashboards.yaml
    options:
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled
  - name: grafana-dashboards
    files:
      - dashboards/slo-demo.json
    options:
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled
