apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: slo-data-db
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: ${DATA_CLIENT_ID}
    keyvaultName: ${KEY_VAULT_NAME}
    tenantId: ${TENANT_ID}
    objects: |
      array:
        - |
          objectName: slo-data-db-password
          objectType: secret
